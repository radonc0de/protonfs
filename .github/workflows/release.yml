name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Build protonfs
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/protonfs-linux-$arch ./cmd/protonfs
          done

      - name: Build bridge
        working-directory: bridge
        run: |
          npm ci
          npm run build
          cp dist/protonfs-bridge.mjs ../dist/

      - name: License notices
        run: |
          {
            echo "protonfs is licensed under GPL-3.0-or-later; see LICENSE."
            echo "Source code: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
            echo
            echo "==== protonfs binary: Go modules ===="
            for mod in $(go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}}@{{.Version}}{{end}}{{end}}' ./cmd/protonfs | sort -u); do
              dir=$(go list -m -f '{{.Dir}}' "$mod")
              echo; echo "---- $mod ----"
              cat "$dir"/LICENSE* 2>/dev/null || echo "(no license file found)"
            done
            echo
            echo "==== protonfs-bridge.mjs: bundled npm packages ===="
            cat bridge/dist/protonfs-bridge.mjs.LEGAL.txt
            for pkg in @protontech/drive-sdk @protontech/crypto openpgp; do
              echo; echo "---- $pkg ----"
              cat bridge/node_modules/$pkg/LICENSE* 2>/dev/null || echo "(license: $(node -p "require('./bridge/node_modules/$pkg/package.json').license"))"
            done
          } > dist/THIRD_PARTY_NOTICES.txt
          cp LICENSE dist/LICENSE

      - name: Checksums
        working-directory: dist
        run: sha256sum protonfs-linux-* protonfs-bridge.mjs > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
