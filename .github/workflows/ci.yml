name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/protonfs

      - name: Build bridge
        working-directory: bridge
        run: |
          npm ci
          npm run build

      - name: shellcheck install.sh
        run: shellcheck -s sh -S warning install.sh
