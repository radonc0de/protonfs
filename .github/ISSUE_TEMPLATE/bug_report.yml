name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security issue? Don't file it here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: protonfs version
      placeholder: output of `protonfs version`
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and architecture
      placeholder: e.g. Fedora 43, x86_64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl --user -u 'protonfs@*' --since '10 min ago'`. Remove private file names before posting."
      render: text
